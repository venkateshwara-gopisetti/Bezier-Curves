name: Feature request
description: Suggest a new function, option or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or use case, not just the solution.
    validations:
      required: true
  - type: textarea
    id: api
    attributes:
      label: Proposed API
      description: What the call would look like, if you have an idea.
      render: python
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself
